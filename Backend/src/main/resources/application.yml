server:
  port: 8080

spring:
  application:
    name: bookcycle
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bookcycle?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 密码走本机用户环境变量 MYSQL_PASS，不写死入库
    password: ${MYSQL_PASS:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.bookcycle.entity
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: false
  support-methods-arguments: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bookcycle.mapper: debug
