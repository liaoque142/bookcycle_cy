server:
  port: 8080

spring:
  application:
    name: bookcycle
  autoconfigure:
    # 纯 JWT 认证，不启用 Security 默认内存用户（避免生成随机密码 + in-memory user）
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      # 单文件上限与请求总上限（评论/私信发图）
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bookcycle?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 密码走本机用户环境变量 MYSQL_PASS，不写死入库
    password: ${MYSQL_PASS:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.bookcycle.entity
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: false
  support-methods-arguments: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  # HS256 密钥（>=32 字节），开发默认值；生产从环境变量注入
  secret: ${JWT_SECRET:bookcycle-dev-secret-key-please-change-in-prod-0123456789}
  # token 有效期 7 天（毫秒）
  expiration: 604800000

app:
  # 图片上传目录（相对后端工作目录；WebConfig 静态映射 /uploads/**）
  upload-dir: ./uploads

logging:
  level:
    com.bookcycle.mapper: debug
